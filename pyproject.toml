[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quarantine-py"
dynamic = ["version"]
description = "When one bad item crashes your loop of 10,000 - don't crash. Set it aside, keep going, fix it later."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "quarantine contributors" }]
keywords = [
    "error-handling",
    "dead-letter-queue",
    "retry",
    "resilience",
    "batch",
    "etl",
    "debugging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/quarantine-py/quarantine"
Source = "https://github.com/quarantine-py/quarantine"
Issues = "https://github.com/quarantine-py/quarantine/issues"
Changelog = "https://github.com/quarantine-py/quarantine/blob/main/CHANGELOG.md"

[project.scripts]
quarantine = "quarantine.cli:main"

[tool.hatch.version]
path = "src/quarantine/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quarantine"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "Makefile",
    "pyproject.toml",
]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
filterwarnings = ["error"]
asyncio_mode = "auto"
xfail_strict = true

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["quarantine"]
branch = true
parallel = true

[tool.coverage.paths]
source = ["src/quarantine", "*/site-packages/quarantine"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if sys.version_info",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",         # builtin shadowing
    "BLE",       # blind except
    "SLF",       # private member access
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RET",       # return
    "PTH",       # pathlib
    "RUF",       # ruff-specific
    "ANN",       # annotations
    "S",         # bandit
    "T20",       # no print
    "PL",        # pylint
    "TRY",       # tryceratops
    "ARG",       # unused arguments
    "D",         # docstrings
]
ignore = [
    "D105",    # magic method docstrings
    "D401",    # properties and accessors read better as noun phrases
    "D107",    # __init__ docstring (documented on the class)
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "ANN401",  # Any is deliberate in several public signatures
    "TRY003",  # long messages outside exception class are fine here
    "TRY400",  # logging.exception not applicable
    "PLR0913", # config objects legitimately take many arguments
    "S301",    # pickle load is the documented core feature
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S",        # asserts, fake passwords and subprocess calls are the point here
    "D",        # test names are the documentation
    "ANN",
    "ARG",
    "T20",
    "TRY",
    "SLF",
    "BLE",
    "PLR2004",
    "PLC0415",  # local imports keep each test self-contained
    "PLC1901",
    "B017",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# The test suite is checked, but not held to the strict-annotation rules:
# `def test_x(tmp_path):` is idiomatic pytest, and annotating it adds no safety.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false
