site_name: quarantine-py
site_description: "Zero-dependency dead-letter queue (DLQ) and loop resilience library for Python. Set bad items aside, keep going, fix them later. By Aritro Saha."
site_author: Aritro Saha
site_url: https://quarantine-py.aritro.cloud/
repo_url: https://github.com/halcyon-past/quarantine
repo_name: halcyon-past/quarantine
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.action.edit

extra:
  social:
    - icon: simple/pypi
      link: https://pypi.org/project/quarantine-py/
      name: quarantine-py on PyPI
    - icon: simple/github
      link: https://github.com/halcyon-past/quarantine
      name: quarantine on GitHub
    - icon: material/web
      link: https://www.aritro.cloud/projects/quarantine
      name: Architecture Case Study by Aritro Saha
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/aritro-saha
      name: Aritro Saha on LinkedIn

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage guide: usage.md
  - Practical examples: examples.md
  - Framework recipes: recipes.md
  - Observability: observability.md
  - CLI reference: cli.md
  - API reference: api.md
  - On-disk format: on-disk-format.md
  - Remote storage:
      - Overview: remote-storage.md
      - AWS S3: aws-s3.md
      - Google Cloud Storage: gcp-gcs.md
      - Azure Blob Storage: azure-blob.md
  - Benchmarks: benchmarks.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Decision records:
      - Overview: adr/README.md
      - 0001 Rename-based atomicity: adr/0001-rename-based-atomicity.md
      - 0002 Directory per record: adr/0002-directory-per-record.md
      - 0003 Pickle-first serialization: adr/0003-pickle-first-serialization.md
      - 0004 Zero runtime dependencies: adr/0004-zero-runtime-dependencies.md
      - 0005 Stateless poison detection: adr/0005-stateless-poison-detection.md
      - 0006 Hooks, not servers: adr/0006-hooks-not-servers.md
      - 0007 Object-store commit point: adr/0007-object-store-commit-point.md
